<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote API Matrix - Premium Brutalism</title>

    <!-- Google Fonts: Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS for utility classes -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Space Grotesk"', 'sans-serif'],
                    },
                    colors: {
                        brutalCream: '#FDFBF7',
                        brutalYellow: '#FFD800',
                        brutalPink: '#FF499E',
                        brutalBlue: '#387BFF',
                        brutalLime: '#B6FF00',
                        brutalWhite: '#FFFFFF',
                    }
                }
            }
        }
    </script>

    <style>
        /* Base styling and retro dot-grid background */
        body {
            background-color: theme('colors.brutalCream');
            background-image: radial-gradient(#111 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            color: #000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            margin: 0;
            overflow-x: hidden;
        }

        /* Core Neo-Brutalist Utilities */
        .brutal-border {
            border: 4px solid #000000;
        }

        .brutal-shadow {
            box-shadow: 8px 8px 0px 0px #000000;
        }

        /* Mechanical Click Animation for Buttons */
        .brutal-btn-interactive {
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .brutal-btn-interactive:hover {
            transform: translate(-2px, -2px);
            box-shadow: 10px 10px 0px 0px #000000;
        }

        .brutal-btn-interactive:active {
            transform: translate(8px, 8px);
            box-shadow: 0px 0px 0px 0px #000000;
        }

        /* Custom Dropdown Styling */
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23000%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22square%22%20stroke-linejoin%3D%22miter%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 1rem top 50%;
            background-size: 1.2rem auto;
            cursor: pointer;
        }

        select:focus {
            outline: 4px solid #000;
            outline-offset: 2px;
        }

        /* Entrance Animations */
        @keyframes popIn {
            0% { opacity: 0; transform: translateY(30px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .animate-entrance {
            opacity: 0;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }

        /* Loader Animation */
        .loader-wrapper {
            display: none; /* Hidden by default */
            justify-content: center;
            align-items: center;
            min-height: 160px;
        }

        .brutal-loader {
            width: 48px;
            height: 48px;
            background-color: theme('colors.brutalYellow');
            border: 4px solid #000;
            animation: flip 1.2s infinite ease-in-out;
        }

        @keyframes flip {
            0% { transform: perspective(120px) rotateX(0deg) rotateY(0deg); background-color: theme('colors.brutalYellow'); }
            25% { transform: perspective(120px) rotateX(-180deg) rotateY(0deg); background-color: theme('colors.brutalPink'); }
            50% { transform: perspective(120px) rotateX(-180deg) rotateY(0deg); background-color: theme('colors.brutalPink'); }
            75% { transform: perspective(120px) rotateX(-180deg) rotateY(-180deg); background-color: theme('colors.brutalBlue'); }
            100% { transform: perspective(120px) rotateX(-180deg) rotateY(-180deg); background-color: theme('colors.brutalBlue'); }
        }
    </style>
</head>
<body>

    <main class="w-full max-w-4xl mx-auto">
        
        <!-- Header Section -->
        <header class="mb-10 text-center animate-entrance">
            <div class="inline-block bg-brutalWhite brutal-border brutal-shadow px-8 py-4 mb-4 transform -rotate-2">
                <h1 class="text-4xl md:text-6xl font-black uppercase tracking-tight text-black">
                    Wisdom Matrix
                </h1>
            </div>
            <p class="text-xl md:text-2xl font-bold bg-brutalLime inline-block px-4 py-1 brutal-border shadow-[4px_4px_0px_0px_#000] transform rotate-1 mt-2">
                Extract the truth.
            </p>
        </header>

        <div class="bg-brutalWhite brutal-border brutal-shadow p-6 md:p-10 animate-entrance delay-1 mb-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                
                <!-- Category Select -->
                <div class="flex flex-col gap-2 relative group">
                    <label for="category" class="font-bold text-sm uppercase tracking-wider ml-1">Category</label>
                    <select id="category" class="w-full bg-brutalPink text-white brutal-border p-4 text-lg font-bold shadow-[4px_4px_0px_0px_#000] hover:shadow-[6px_6px_0px_0px_#000] transition-shadow">
                        <option value="Courage Grit  Silence">Courage Grit Silence</option>
                        <option value="Deep Life Wisdom">Deep Life Wisdom</option>
                        <option value="Focus Purpose  Mastery">Focus Purpose Mastery</option>
                        <option value="Happiness Joy  Freedom">Happiness Joy Freedom</option>
                        <option value="Human Psychology  Wit">Human Psychology Wit</option>
                        <option value="Inner Peace  Stoicism">Inner Peace Stoicism</option>
                        <option value="Love Relationships  Empathy">Love Relationships Empathy</option>
                        <option value="Mindset Success  Motivation">Mindset Success Motivation</option>
                        <option value="Time Aging  Destiny">Time Aging Destiny</option>
                    </select>
                </div>

                <!-- Language Select -->
                <div class="flex flex-col gap-2">
                    <label for="language" class="font-bold text-sm uppercase tracking-wider ml-1">Language</label>
                    <select id="language" class="w-full bg-brutalBlue text-white brutal-border p-4 text-lg font-bold shadow-[4px_4px_0px_0px_#000] hover:shadow-[6px_6px_0px_0px_#000] transition-shadow">
                        <option value="english">English</option>
                        <option value="hinglish">Hinglish</option>
                    </select>
                </div>

                <!-- Part Select -->
                <div class="flex flex-col gap-2">
                    <label for="part" class="font-bold text-sm uppercase tracking-wider ml-1">Volume</label>
                    <select id="part" class="w-full bg-brutalLime text-black brutal-border p-4 text-lg font-bold shadow-[4px_4px_0px_0px_#000] hover:shadow-[6px_6px_0px_0px_#000] transition-shadow">
                        <option value="1">Part 1</option>
                        <option value="2">Part 2</option>
                        <option value="3">Part 3</option>
                        <option value="4">Part 4</option>
                        <option value="5">Part 5</option>
                        <option value="6">Part 6</option>
                        <option value="7">Part 7</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="flex justify-center mb-10 animate-entrance delay-2 z-10 relative">
            <button onclick="fetchQuote()" class="bg-brutalYellow text-black brutal-border brutal-shadow brutal-btn-interactive text-2xl md:text-3xl font-black uppercase px-12 py-5 w-full md:w-auto tracking-wide">
                Get Quote
            </button>
        </div>

        <!-- Quote Display Box -->
        <div id="quoteWrapper" class="bg-brutalWhite brutal-border brutal-shadow p-8 md:p-14 relative animate-entrance delay-3 min-h-[200px] flex items-center justify-center">
            
            <!-- Decorative Accent -->
            <div class="absolute -top-4 -left-4 w-8 h-8 bg-black"></div>
            <div class="absolute -bottom-4 -right-4 w-8 h-8 bg-black"></div>

            <div id="quoteDisplay" class="relative z-10 w-full text-center">
                <p id="quoteText" class="font-semibold text-2xl md:text-4xl text-black leading-relaxed">
                    Select a category, language, and volume to pull data directly from the matrix.
                </p>
            </div>

            <!-- Loader element (hidden initially) -->
            <div id="loader" class="loader-wrapper absolute inset-0 bg-brutalWhite z-20">
                <div class="brutal-loader shadow-[6px_6px_0px_0px_#000]"></div>
            </div>
        </div>

    </main>

    <script>
        async function fetchQuote() {
            const category = document.getElementById('category').value;
            const language = document.getElementById('language').value;
            const part = document.getElementById('part').value;
            
            const quoteText = document.getElementById('quoteText');
            const quoteDisplay = document.getElementById('quoteDisplay');
            const loader = document.getElementById('loader');

            // Constructs the exact URL requested. 
            // encodeURIComponent() safely turns spaces into %20
            const fileName = `${language}_part${part}.json`;
            const url = `https://raw.githubusercontent.com/KunalTheDev-11/Quotes_Data/main/${encodeURIComponent(category)}/${fileName}`;

            // Show loader, hide text
            quoteDisplay.style.opacity = '0';
            loader.style.display = 'flex';

            try {
                const response = await fetch(url);
                
                // If a specific part (like Part 7) doesn't exist in a folder, handle the 404
                if (!response.ok) {
                    throw new Error(`File ${fileName} not found in this category.`);
                }
                
                const quotes = await response.json();
                
                // Select a random quote from the fetched JSON array
                const randomIndex = Math.floor(Math.random() * quotes.length);
                const randomQuote = quotes[randomIndex];

                // Add quotes and styling formatting
                quoteText.innerHTML = `"${randomQuote}"`;
                quoteText.style.color = '#000'; // Ensure text is black on success

            } catch (error) {
                // Formatting error message
                quoteText.innerHTML = `<span class="bg-red-500 text-white px-2 uppercase border-2 border-black">Error</span><br/>${error.message}`;
                console.error("Fetch error:", error);
            } finally {
                // Small delay to ensure the brutalist loader animation is seen briefly
                setTimeout(() => {
                    loader.style.display = 'none';
                    quoteDisplay.style.transition = 'opacity 0.3s ease-in';
                    quoteDisplay.style.opacity = '1';
                }, 400); 
            }
        }
    </script>

</body>
</html>
