<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote API Matrix</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-primary: #c9d1d9;
            --accent: #58a6ff;
            --border: #30363d;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        select, button {
            background-color: var(--bg-color);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }
        button {
            background-color: #238636;
            color: #ffffff;
            border-color: rgba(240,246,252,0.1);
            font-weight: 600;
            transition: 0.2s ease;
            width: 100%;
            max-width: 200px;
            margin: 0 auto;
            display: block;
        }
        button:hover {
            background-color: #2ea043;
        }
        .quote-box {
            margin-top: 30px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-style: italic;
            line-height: 1.5;
            color: #ffffff;
            padding: 20px;
            background: #0d1117;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .loader {
            display: none;
            border: 3px solid var(--border);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <h2>Wisdom API Matrix</h2>
        
        <div class="controls">
            <!-- All 9 folders from the repository -->
            <select id="category">
                <option value="Courage Grit  Silence">Courage Grit Silence</option>
                <option value="Deep Life Wisdom">Deep Life Wisdom</option>
                <option value="Focus Purpose  Mastery">Focus Purpose Mastery</option>
                <option value="Happiness Joy  Freedom">Happiness Joy Freedom</option>
                <option value="Human Psychology  Wit">Human Psychology Wit</option>
                <option value="Inner Peace  Stoicism">Inner Peace Stoicism</option>
                <option value="Love Relationships  Empathy">Love Relationships Empathy</option>
                <option value="Mindset Success  Motivation">Mindset Success Motivation</option>
                <option value="Time Aging  Destiny">Time Aging Destiny</option>
            </select>

            <select id="language">
                <option value="english">English</option>
                <option value="hinglish">Hinglish</option>
            </select>

            <select id="part">
                <option value="1">Part 1</option>
                <option value="2">Part 2</option>
                <option value="3">Part 3</option>
                <option value="4">Part 4</option>
                <option value="5">Part 5</option>
                <option value="6">Part 6</option>
                <option value="7">Part 7</option>
            </select>
        </div>

        <button onclick="fetchQuote()">Get Quote</button>
        <div class="loader" id="loader"></div>

        <div class="quote-box" id="quoteDisplay">
            Select a category, language, and part to pull data directly from the matrix.
        </div>
        
    </div>

    <script>
        async function fetchQuote() {
            const category = document.getElementById('category').value;
            const language = document.getElementById('language').value;
            const part = document.getElementById('part').value;
            
            const quoteDisplay = document.getElementById('quoteDisplay');
            const loader = document.getElementById('loader');

            // Constructs the exact URL requested. 
            // encodeURIComponent() safely turns spaces into %20
            const fileName = `${language}_part${part}.json`;
            const url = `https://raw.githubusercontent.com/KunalTheDev-11/Quotes_Data/main/${encodeURIComponent(category)}/${fileName}`;

            quoteDisplay.style.display = 'none';
            loader.style.display = 'block';

            try {
                const response = await fetch(url);
                
                // If a specific part (like Part 7) doesn't exist in a folder, handle the 404
                if (!response.ok) {
                    throw new Error(`File ${fileName} not found in this category.`);
                }
                
                const quotes = await response.json();
                
                // Select a random quote from the fetched JSON array
                const randomIndex = Math.floor(Math.random() * quotes.length);
                const randomQuote = quotes[randomIndex];

                quoteDisplay.textContent = `"${randomQuote}"`;
            } catch (error) {
                quoteDisplay.textContent = error.message;
                console.error("Fetch error:", error);
            } finally {
                loader.style.display = 'none';
                quoteDisplay.style.display = 'flex';
            }
        }
    </script>

</body>
</html>
